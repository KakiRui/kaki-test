<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kaki记数表-测试</title>
    <style>
        :root[data-theme="cream"] {
            --m-bg: #f5f3f0;
            --m-text: #5a5a5a;
            --m-border: #dcd7cf;
            --m-blue-main: #9cb1c0;
            --m-green-main: #a3b09c;
            --m-yellow-act: #e2d2ae;
            --m-green-rec: #dce0d9;
            --m-danger: #b09c9c;
            --m-card: #ffffff;
            --m-panel: #faf8f6;
            --m-input: #fffcf9;
            --m-chip: #eeece8;
            --m-muted: #888888;
            --m-soft: #a5a0a0;
            --m-btn: #f0f0f0;
            --m-sort: #f4f7f4;
            --m-sort-border: #d6ddd4;
            --m-sort-text: #6f7f6a;
            --m-tip: rgba(255, 255, 255, 0.95);
            --m-sold: #e9e7e4;
            --m-sold-border: #d8d3cd;
            --m-sold-text: #b0adb0;
            --m-footer: #d1cdc8;
            --m-status: #f4efe7;
            --m-badge: #eeece8;
            --m-warn-bg: #f2e7e7;
            --m-warn-text: #8f6f6f;
            --m-warn-border: #d8c3c3;
            --m-divider: #f0edeb;
            --m-tag-hover: #a3b3bd;
            --m-upload-bg: #ffffff;
            --m-mini: #f6f4f2;
            --m-modal: #ffffff;
            --m-shadow: rgba(90, 90, 90, 0.08);
            --m-on-accent: #ffffff;
            --m-remove-bg: rgba(0, 0, 0, 0.55);
        }

        :root[data-theme="dark"] {
            --m-bg: #000000;
            --m-text: #bdc7ce;
            --m-border: #4a5156;
            --m-blue-main: #79838b;
            --m-green-main: #3f474c;
            --m-yellow-act: #4a5156;
            --m-green-rec: #24292e;
            --m-danger: #bdc7ce;
            --m-card: #24292e;
            --m-panel: #24292e;
            --m-input: #24292e;
            --m-chip: #24292e;
            --m-muted: #808a92;
            --m-soft: #808a92;
            --m-btn: #24292e;
            --m-sort: #4a5156;
            --m-sort-border: #808a92;
            --m-sort-text: #bdc7ce;
            --m-tip: rgba(36, 41, 46, 0.97);
            --m-sold: #24292e;
            --m-sold-border: #4a5156;
            --m-sold-text: #808a92;
            --m-footer: #808a92;
            --m-status: #24292e;
            --m-badge: #24292e;
            --m-warn-bg: #40363a;
            --m-warn-text: #d9c3c7;
            --m-warn-border: #5c4b50;
            --m-divider: #4a5156;
            --m-tag-hover: #bdc7ce;
            --m-upload-bg: #24292e;
            --m-mini: #24292e;
            --m-modal: #24292e;
            --m-shadow: rgba(0, 0, 0, 0.50);
            --m-on-accent: #bdc7ce;
            --m-remove-bg: rgba(0, 0, 0, 0.55);
        }

        /* 暗黑模式：数字卡明暗对比加强 */
        :root[data-theme="dark"] .num-card {
            background: #1a2025;
            border-color: #59636b;
            color: #aeb8c0;
        }
        :root[data-theme="dark"] .num-card.selected {
            background: #d7dee2;
            border-color: #e8eef1;
            color: #0b0f12;
        }
        :root[data-theme="dark"] .num-card.sold {
            background: #151a1f;
            border-color: #394046;
            color: #5d666d;
            opacity: 0.75;
        }

        /* 暗黑模式：次级按钮与提示底色增强可见度 */
        :root[data-theme="dark"] .btn-clear {
            background: #151a20 !important;
            color: #aeb8c0 !important;
            border: 1px solid #4a5156 !important;
        }
        :root[data-theme="dark"] .sort-btn {
            background: #23282d;
            color: #8b959d;
            border: 1px solid #394046;
        }
        :root[data-theme="dark"] .ai-status {
            background: #151a20;
            border: 1px solid #4a5156;
            color: #aeb8c0;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            margin: 0; padding: 12px; 
            background: var(--m-bg); 
            color: var(--m-text);
            min-height: 100vh;
        }

        .theme-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--m-card);
            border: 1px solid var(--m-border);
            color: var(--m-muted);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            z-index: 100001;
            box-shadow: 0 3px 10px var(--m-shadow);
        }

        .theme-modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.25);
            display: none;
            z-index: 100002;
        }
        .theme-modal-bg.show { display: flex; align-items: center; justify-content: center; }
        .theme-modal {
            background: var(--m-modal);
            border: 1px solid var(--m-border);
            border-radius: 14px;
            padding: 18px;
            width: 280px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .theme-modal h4 { margin: 0 0 12px 0; color: var(--m-muted); font-size: 14px; }
        .theme-option { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--m-border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--m-card); font-size: 13px; font-weight: bold; color: var(--m-text); }
        .theme-option.active { border-color: var(--m-blue-main); background: var(--m-green-rec); }
        .theme-option span { font-size: 11px; color: var(--m-soft); font-weight: normal; }
        .theme-close { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid var(--m-border); background: var(--m-chip); color: var(--m-muted); cursor: pointer; font-size: 12px; font-weight: bold; margin-top: 4px; }
        
        .toolbar { 
            background: var(--m-card); padding: 15px; border-radius: 15px; 
            box-shadow: 0 4px 15px var(--m-shadow); 
            margin-bottom: 12px;
        }

        .input-row { 
            display: grid; 
            grid-template-columns: auto 60px 1fr 85px; 
            gap: 8px; 
            align-items: center; 
            margin-bottom: 10px;
        }
        .search-row { display: grid; grid-template-columns: 1fr 85px; gap: 8px; margin-bottom: 10px; }

        .batch-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; white-space: nowrap; }
        .tab { padding: 6px 14px; background: var(--m-chip); border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--m-muted); border: 1px solid transparent; }
        .tab.active { background: var(--m-blue-main); color: var(--m-on-accent); border-color: var(--m-blue-main); font-weight: bold; }
        .add-tab-btn { padding: 5px 12px; background: var(--m-card); border: 1.2px dashed var(--m-blue-main); color: var(--m-blue-main); border-radius: 20px; font-size: 12px; font-weight: bold; flex-shrink: 0; }

        .button-group { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            border-top: 1px solid var(--m-divider); padding-top: 10px;
        }
        .button-group button { padding: 10px; font-size: 12px; border-radius: 8px; border: 1px solid var(--m-border); background: var(--m-chip); color: var(--m-text); font-weight: bold; cursor: pointer; }

        .pool-box { background: var(--m-card); padding: 18px; border-radius: 15px; box-shadow: 0 4px 12px var(--m-shadow); }
        .scroll-area { max-height: 40vh; overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 10px; }
        
        .num-card { 
            height: 48px; border: 1.5px solid var(--m-blue-main); color: var(--m-blue-main); 
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            border-radius: 8px; cursor: pointer; background: var(--m-panel);
        }
        .num-card.selected { background: var(--m-yellow-act); border-color: var(--m-yellow-act); color: var(--m-text); }
        .num-card.sold { background: var(--m-sold); border-color: var(--m-sold-border); color: var(--m-sold-text); text-decoration: line-through; opacity: 0.9; }

        .global-owner-tip {
            position: fixed;
            background: var(--m-tip);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--m-blue-main);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 100000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 1px solid var(--m-border);
            animation: tipFade 0.7s forwards; 
            transform: translate(-50%, -130%);
        }
        @keyframes tipFade { 
            0% { opacity: 0; transform: translate(-50%, -100%); } 
            20% { opacity: 1; transform: translate(-50%, -130%); }
            80% { opacity: 1; transform: translate(-50%, -130%); }
            100% { opacity: 0; transform: translate(-50%, -140%); }
        }

        .customer-card { background: var(--m-card); border: 1.5px solid var(--m-border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .customer-card.can-receive { border-color: var(--m-green-main); background: var(--m-green-rec); }
        .cust-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .cust-title { min-width: 0; overflow-wrap: anywhere; }
        .tag-box { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag { background: var(--m-blue-main); color: var(--m-on-accent); padding: 4px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .tag:hover { background: var(--m-tag-hover); }
        
        input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--m-border); border-radius: 8px; font-size: 14px; background: var(--m-input); color: var(--m-text); }
        select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--m-border); border-radius: 8px; font-size: 14px; background: var(--m-input); color: var(--m-text); }
        textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--m-border); border-radius: 8px; font-size: 13px; background: var(--m-input); color: var(--m-text); line-height: 1.45; }
        .btn-action { background: var(--m-green-main) !important; color: var(--m-on-accent) !important; border: none !important; height: 38px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .btn-clear { background: var(--m-chip) !important; color: var(--m-muted) !important; border: none !important; height: 38px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        
        .copy-btn { font-size: 11px; background: var(--m-btn); border-radius: 4px; padding: 2px 6px; cursor: pointer; color: var(--m-muted); border: 1px solid var(--m-border); margin-left: 5px; white-space: nowrap; }
        .sort-btn { font-size: 11px; background: var(--m-sort); border-radius: 4px; padding: 2px 6px; cursor: pointer; color: var(--m-sort-text); border: 1px solid var(--m-sort-border); margin-left: 5px; white-space: nowrap; }

        #statusMsg { background: var(--m-yellow-act); padding: 10px; border-radius: 8px; color: var(--m-text); font-size: 13px; margin-bottom: 12px; text-align: center; border: 1px solid var(--m-border); }
        .footer-credit { text-align: center; font-size: 10px; color: var(--m-footer); margin-top: 20px; font-style: italic; }

        .list-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
        .list-header-title { margin: 0; color: var(--m-muted); }
        .list-header-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

        .ai-panel { background: var(--m-panel); border: 1px solid var(--m-border); border-radius: 12px; padding: 14px; margin-bottom: 15px; }
        .ai-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .ai-label { font-size: 12px; color: var(--m-muted); margin-bottom: 5px; display: block; }
        .ai-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .ai-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
        .ai-note { font-size: 11px; color: var(--m-soft); line-height: 1.4; }

        .api-toggle { padding: 9px 10px; border: 1px solid var(--m-border); background: var(--m-chip); color: var(--m-text); border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .api-config { border: 1px solid var(--m-border); background: var(--m-card); border-radius: 10px; padding: 12px; display: none; }
        .api-config.show { display: block; }
        .api-section-title { font-size: 12px; font-weight: bold; color: var(--m-muted); margin: 0 0 8px 0; }
        .preset-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .preset-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .mini-btn { padding: 8px; font-size: 11px; border-radius: 7px; border: 1px solid var(--m-border); background: var(--m-mini); color: var(--m-text); cursor: pointer; font-weight: bold; }

        details.prompt-box { border: 1px solid var(--m-border); border-radius: 10px; background: var(--m-card); padding: 10px 12px; }
        details.prompt-box summary { cursor: pointer; font-size: 12px; font-weight: bold; color: var(--m-text); }
        details.prompt-box summary small { margin-left: 7px; font-size: 11px; color: var(--m-soft); font-weight: normal; }
        details.prompt-box textarea { margin-top: 10px; }

        .ai-upload { border: 1.5px dashed var(--m-blue-main); background: var(--m-upload-bg); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; color: var(--m-blue-main); font-size: 13px; font-weight: bold; }
        .ai-image-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
        .ai-image-item { position: relative; flex-shrink: 0; }
        .ai-image-item img { height: 70px; width: auto; max-width: 130px; object-fit: cover; border-radius: 8px; border: 1px solid var(--m-border); display: block; }
        .ai-image-remove { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--m-remove-bg); color: var(--m-on-accent); font-size: 10px; line-height: 18px; padding: 0; cursor: pointer; }
        .ai-status { min-height: 18px; font-size: 12px; color: var(--m-text); background: var(--m-status); border-radius: 8px; padding: 8px; margin-top: 8px; display: none; }
        .ai-status.show { display: block; }
        .ai-preview { margin-top: 10px; }
        .ai-preview-card { background: var(--m-card); border: 1px solid var(--m-border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
        .ai-preview-head { font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .ai-badge { font-size: 10px; font-weight: normal; padding: 2px 6px; border-radius: 8px; background: var(--m-badge); color: var(--m-muted); }
        .ai-num-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .ai-num { background: var(--m-green-rec); color: var(--m-sort-text); border-radius: 6px; padding: 2px 7px; font-size: 12px; }
        .ai-num.warn { background: var(--m-warn-bg); color: var(--m-warn-text); }
        .model-picker {
            margin-top: 8px;
            max-height: 130px;
            overflow-y: auto;
            border: 1px solid var(--m-border);
            border-radius: 8px;
            background: var(--m-input);
            display: none;
        }
        .model-picker.show { display: block; }
        .model-picker-item {
            padding: 8px 10px;
            font-size: 12px;
            color: var(--m-text);
            border-bottom: 1px solid var(--m-border);
            cursor: pointer;
            line-height: 1.3;
        }
        .model-picker-item:hover { background: var(--m-chip); }
        .model-picker-item.active { background: var(--m-green-rec); color: var(--m-text); font-weight: bold; }
        .ai-hide { display: none; }

        @media (max-width: 420px) {
            .ai-row, .preset-row { grid-template-columns: 1fr; }
            .list-header { align-items: flex-start; }
        }
    </style>
</head>
<body>

<button class="theme-btn" onclick="openThemeModal()" title="切换主题">🎨</button>

<div id="themeModalBg" class="theme-modal-bg" onclick="closeThemeModal(event)">
    <div class="theme-modal" onclick="event.stopPropagation()">
        <h4>🎨 切换主题</h4>
        <div class="theme-option" id="theme-cream" onclick="changeTheme('cream')">默认 <span>明亮柔和</span></div>
        <div class="theme-option" id="theme-dark" onclick="changeTheme('dark')">暗黑模式 <span>灰蓝深色</span></div>
        <button class="theme-close" onclick="closeThemeModal()">关闭</button>
    </div>
</div>

<div class="toolbar" style="margin-top:46px;">
    <div class="batch-tabs">
        <button class="add-tab-btn" onclick="addNewBatch()">+ 新档位</button>
        <div id="batchTabsList" style="display:flex; gap:8px;"></div>
    </div>
    
    <div class="input-row">
        <span style="white-space:nowrap;">范围:1到</span>
        <input type="number" id="totalNum" value="50" onchange="updateBatchTotal()">
        <input type="text" id="custInput" placeholder="输入顾客名字">
        <button class="btn-action" onclick="addCustomer()">添加顾客</button>
    </div>

    <div class="search-row">
        <input type="text" id="searchBar" placeholder="🔍快速过滤顾客..." oninput="renderCustomers()">
        <button class="btn-clear" onclick="clearFilter()">清空搜索</button>
    </div>

    <div class="button-group">
        <button onclick="resetSoldStatus()">重置本档数字</button>
        <button style="background:var(--m-warn-bg);border-color:var(--m-warn-border);color:var(--m-warn-text);" onclick="initSystem()">清空所有档位</button>
    </div>
</div>

<div id="statusMsg" style="display:none;"></div>

<div class="pool-box">
    <h4 style="margin:0; color:var(--m-muted); display:flex; justify-content:space-between; align-items:center;">
        <span>🔢 数字表</span>
        <span class="copy-btn" onclick="copyRemaining()">复制剩余号码</span>
    </h4>
    <div class="scroll-area">
        <div id="numberGrid" class="grid"></div>
    </div>
</div>

<div style="background:var(--m-card); padding:18px; border-radius:15px; box-shadow:0 4px 12px var(--m-shadow); margin-top:12px;">
    <div class="list-header">
        <h4 class="list-header-title">👥 顾客清单</h4>
        <div class="list-header-actions">
            <button class="sort-btn" onclick="sortAllCustomerNums()">🔢 一键按编号排序</button>
            <button class="copy-btn" onclick="toggleAiPanel()">🤖 AI导入</button>
        </div>
    </div>

    <div id="aiPanel" class="ai-panel" style="display:none;">
        <div class="ai-grid">
            <button class="api-toggle" onclick="toggleApiConfig()">⚙️ API 接口设置 / 预设</button>

            <div id="apiConfigPanel" class="api-config">
                <p class="api-section-title">接口预设</p>
                <div class="preset-row">
                    <div>
                        <label class="ai-label">选择已保存预设</label>
                        <select id="aiPresetSelect" onchange="applySelectedPreset()"></select>
                    </div>
                    <div>
                        <label class="ai-label">预设名称</label>
                        <input type="text" id="aiPresetName" placeholder="例如：我的识图接口">
                    </div>
                </div>
                <div class="preset-actions">
                    <button class="mini-btn" onclick="saveCurrentPreset()">保存当前</button>
                    <button class="mini-btn" onclick="deleteSelectedPreset()">删除预设</button>
                    <button class="mini-btn" onclick="renderAiConfig()">刷新列表</button>
                </div>

                <p class="api-section-title">接口信息</p>
                <div class="ai-grid">
                    <div>
                        <label class="ai-label">接口地址（支持 OpenAI 兼容接口）</label>
                        <input type="text" id="aiEndpoint" placeholder="例如：https://api.openai.com/v1" oninput="saveAiCfg()">
                    </div>
                    <div>
                        <label class="ai-label">API Key（只保存在本机）</label>
                        <input type="password" id="aiKey" placeholder="sk-..." oninput="saveAiCfg()">
                    </div>
                    <div>
                        <label class="ai-label">可识图模型名称</label>
                        <input type="text" id="aiModel" placeholder="例如：gpt-4o-mini" oninput="saveAiCfg()">
                        <div id="aiModelPicker" class="model-picker"></div>
                    </div>
                    <div class="ai-actions">
                        <button class="mini-btn" onclick="fetchAiModels()">拉取模型</button>
                        <button class="mini-btn" onclick="renderAiConfig()">刷新配置</button>
                    </div>
                    <div class="ai-note">拉取模型会调用接口的 /models 地址。拉取成功后，下方会显示可点击的模型列表；如果接口不支持，就手动填写模型名。</div>
                </div>
            </div>

            <details class="prompt-box">
                <summary>🧾 识别提示词 <small>点击展开</small></summary>
                <textarea id="aiPrompt" rows="8"></textarea>
                <div class="ai-note">提示词里的 {total} 会自动替换成当前档位的数字范围。</div>
            </details>

            <div class="ai-upload" onclick="document.getElementById('aiImageInput').click()">
                📷 上传 / 拖入聊天记录截图；也可以直接 Ctrl+V 粘贴截图
                <div class="ai-note">支持多张截图，会逐张识图。</div>
            </div>
            <input type="file" id="aiImageInput" class="ai-hide" accept="image/*" multiple onchange="addAiImageFiles(this.files)">
            <div id="aiImageList" class="ai-image-list"></div>
            <div class="ai-note">导入位置：<b id="aiTargetBatch">当前档位</b>。会自动跳过已占用编号；结果先预览，不会直接写入。</div>
            <div class="ai-actions">
                <button class="btn-action" onclick="runAiImport()">开始识图</button>
                <button class="btn-clear" onclick="clearAiPreview()">清空预览</button>
            </div>
            <div id="aiStatus" class="ai-status"></div>
            <div id="aiPreview" class="ai-preview"></div>
        </div>
    </div>

    <div id="customerList"></div>
    <div class="footer-credit">@Kaki 内部交流版本 禁止二传</div>
</div>

<script>
    let batches = JSON.parse(localStorage.getItem('kaki_v2_data')) || [{ id: '默认档', customers: [], total: 50 }];
    let currentIdx = 0;
    let selectedNums = [];
    let aiImages = [];
    let aiResults = [];
    let aiModels = [];

    const defaultAiPrompt = `你是图片信息提取助手。请仔细识别聊天记录截图中每个用户发送的数字编号，并提取用户名字，忽略括号内的名字，那是好友备注。
要求：
1. 只提取用户明确选择的数字编号，忽略价格、表情、系统消息和其他无关内容。
2. 同一个用户的所有编号合并到同一个 numbers 数组。
3. 只保留 1 到 {total} 之间的整数；不要猜测、补全或修改没有明确出现的编号。
4. 如果图片中没有有效购买记录，返回 {"customers":[]}。
5. 只输出 JSON，不要输出 Markdown、解释或其他文字。格式如下：
{"customers":[{"name":"用户名字","numbers":[2,4,7,10]}]}`;

    let aiCfg = JSON.parse(localStorage.getItem('kaki_ai_cfg') || '{}');
    if(!aiCfg.presets) aiCfg.presets = [];
    if(!aiCfg.prompt || aiCfg.prompt.includes('买断图片编号')) aiCfg.prompt = defaultAiPrompt;

    function save() { localStorage.setItem('kaki_v2_data', JSON.stringify(batches)); }

    function openThemeModal() {
        document.getElementById('themeModalBg').classList.add('show');
        updateThemeOptions();
    }
    function closeThemeModal(event) {
        if(event && event.type === 'click' && event.target?.id !== 'themeModalBg' && !event.target?.classList?.contains('theme-close')) return;
        document.getElementById('themeModalBg').classList.remove('show');
    }
    function updateThemeOptions() {
        const current = document.documentElement.dataset.theme;
        document.getElementById('theme-cream').classList.toggle('active', current === 'cream');
        document.getElementById('theme-dark').classList.toggle('active', current === 'dark');
    }
    function changeTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('kaki_theme', theme);
        updateThemeOptions();
        closeThemeModal();
    }
    changeTheme(localStorage.getItem('kaki_theme') || 'cream');

    function saveAiCfg() {
        aiCfg.endpoint = document.getElementById('aiEndpoint').value.trim();
        aiCfg.key = document.getElementById('aiKey').value.trim();
        aiCfg.model = document.getElementById('aiModel').value.trim();
        aiCfg.prompt = document.getElementById('aiPrompt').value;
        localStorage.setItem('kaki_ai_cfg', JSON.stringify(aiCfg));
    }

    function handleTabClick(idx) {
        if (currentIdx === idx) {
            if (batches.length <= 1) return alert("至少保留一个档位哦！");
            if (confirm(`确定要删除当前的【${batches[idx].id}】档位吗？`)) {
                batches.splice(idx, 1);
                currentIdx = 0;
                renderAll();
                save();
            }
        } else {
            currentIdx = idx;
            selectedNums = [];
            renderAll();
        }
    }

    function addNewBatch() {
        const name = prompt("请输入新档位名称", "新档位");
        if(!name) return;
        batches.push({ id: name, customers: [], total: 50 });
        currentIdx = batches.length - 1;
        renderAll();
        save();
    }

    function clearFilter() {
        document.getElementById('searchBar').value = '';
        renderCustomers();
    }

    function updateBatchTotal() {
        batches[currentIdx].total = parseInt(document.getElementById('totalNum').value) || 50;
        renderGrid();
        renderAiPreview();
        save();
    }

    function showOwnerTip(event, num) {
        const owner = batches[currentIdx].customers.find(c => c.nums.flat().includes(num));
        if(!owner) return;
        const oldTip = document.querySelector('.global-owner-tip');
        if(oldTip) oldTip.remove();
        const tip = document.createElement('div');
        tip.className = 'global-owner-tip';
        tip.innerHTML = `拥有者: ${owner.name}`;
        const rect = event.target.getBoundingClientRect();
        tip.style.left = (rect.left + rect.width / 2) + 'px';
        tip.style.top = rect.top + 'px';
        document.body.appendChild(tip);
        setTimeout(() => { if(tip) tip.remove(); }, 700); 
    }

    function copyText(text) {
        const t = document.createElement("textarea");
        t.value = text; document.body.appendChild(t);
        t.select(); document.execCommand("copy");
        document.body.removeChild(t);
        alert("已复制！");
    }

    function copyRemaining() {
        const b = batches[currentIdx];
        const sold = b.customers.flatMap(c => c.nums.flat());
        let rem = [];
        for(let i=1; i<=b.total; i++) if(!sold.includes(i)) rem.push(i);
        copyText(`【${b.id}】余号[${rem.length}]:\n${rem.join(', ')}`);
    }

    function copyCustomerNums(cIdx) {
        const c = batches[currentIdx].customers[cIdx];
        const res = c.nums.map(batch => batch.join(' ')).join(' | ');
        copyText(`${c.name}的成绩单(  •̀ω•́  )ｷﾘｯ\n${res}`);
    }

    function addCustomer() {
        const input = document.getElementById('custInput');
        if(!input.value.trim()) return;
        batches[currentIdx].customers.unshift({ name: input.value.trim(), nums: [] });
        input.value = '';
        renderAll();
        save();
    }

    function selectNumber(num) {
        const idx = selectedNums.indexOf(num);
        if (idx > -1) selectedNums.splice(idx, 1);
        else selectedNums.push(num);
        renderAll();
    }

    function bindToCustomer(index) {
        if(selectedNums.length === 0) return;
        batches[currentIdx].customers[index].nums.push([...selectedNums].sort((a,b) => a-b));
        selectedNums = [];
        renderAll();
        save();
    }

    function unbindNumber(cIdx, bIdx, num) {
        if(confirm(`确定删除数字 ${num} 吗？`)) {
            batches[currentIdx].customers[cIdx].nums[bIdx] = batches[currentIdx].customers[cIdx].nums[bIdx].filter(n => n !== num);
            if(batches[currentIdx].customers[cIdx].nums[bIdx].length === 0) batches[currentIdx].customers[cIdx].nums.splice(bIdx, 1);
            renderAll();
            save();
        }
    }

    function sortCustomerNums(cIdx) {
        const c = batches[currentIdx].customers[cIdx];
        if(!c.nums.length) return;
        c.nums = [c.nums.flat().sort((a, b) => a - b)];
        renderAll();
        save();
    }

    function sortAllCustomerNums() {
        const count = batches[currentIdx].customers.length;
        if(!count) return alert("当前档位还没有顾客数据。");
        if(confirm(`将当前档位【${batches[currentIdx].id}】中所有顾客的编号统一按从小到大排序整理吗？`)) {
            batches[currentIdx].customers.forEach(c => {
                if(c.nums.length) c.nums = [c.nums.flat().sort((a, b) => a - b)];
            });
            renderAll();
            save();
        }
    }

    function deleteCustomer(idx) { if(confirm(`彻底删除顾客 ${batches[currentIdx].customers[idx].name}？`)) { batches[currentIdx].customers.splice(idx, 1); renderAll(); save(); } }

    function initSystem() { if(confirm("警告：这将清空所有档位的所有数据！")) { batches = [{ id: '默认档', customers: [], total: 50 }]; currentIdx = 0; renderAll(); save(); } }
    function resetSoldStatus() { if(confirm("清空本档所有数字绑定？")) { batches[currentIdx].customers.forEach(c => c.nums = []); renderAll(); save(); } }

    function renderAll() {
        document.getElementById('totalNum').value = batches[currentIdx].total;
        const tabs = document.getElementById('batchTabsList');
        tabs.innerHTML = batches.map((b, i) => `<div class="tab ${i === currentIdx ? 'active' : ''}" onclick="handleTabClick(${i})">${b.id}</div>`).join('');
        renderGrid();
        renderCustomers();
        document.getElementById('aiTargetBatch').innerText = batches[currentIdx].id;
        const msg = document.getElementById('statusMsg');
        msg.style.display = selectedNums.length > 0 ? 'block' : 'none';
        msg.innerText = `🎯 已选中 [ ${selectedNums.join(',')} ]，点人名绑定`;
    }

    function renderGrid() {
        const grid = document.getElementById('numberGrid');
        const soldNums = batches[currentIdx].customers.flatMap(c => c.nums.flat());
        grid.innerHTML = '';
        for(let i=1; i<=batches[currentIdx].total; i++) {
            const div = document.createElement('div');
            const isSold = soldNums.includes(i);
            div.className = `num-card ${isSold ? 'sold' : ''} ${selectedNums.includes(i) ? 'selected' : ''}`;
            div.innerText = i;
            div.onclick = isSold ? (e) => showOwnerTip(e, i) : () => selectNumber(i);
            grid.appendChild(div);
        }
    }

    function renderCustomers() {
        const list = document.getElementById('customerList');
        const search = document.getElementById('searchBar').value.toLowerCase();
        list.innerHTML = '';
        batches[currentIdx].customers.forEach((c, cIdx) => {
            if(search && !c.name.toLowerCase().includes(search)) return;
            const card = document.createElement('div');
            card.className = `customer-card ${selectedNums.length > 0 ? 'can-receive' : ''}`;
            if(selectedNums.length > 0) card.onclick = () => bindToCustomer(cIdx);
            const tags = c.nums.map((batch, bIdx) => 
                batch.map(n => `<span class="tag" onclick="event.stopPropagation(); unbindNumber(${cIdx}, ${bIdx}, ${n})">${n}</span>`).join('')
            ).join('<span style="color:var(--m-soft);margin:0 5px;">|</span>');

            card.innerHTML = `
                <div class="cust-header">
                    <div class="cust-title">
                        <span style="font-weight:bold;">👤 ${c.name}</span>
                        <span style="font-size:11px; background:var(--m-yellow-act); padding:1px 6px; border-radius:10px; margin-left:5px;">${c.nums.flat().length}张</span>
                        <button class="copy-btn" onclick="event.stopPropagation(); copyCustomerNums(${cIdx})">复制成绩单</button>
                        <button class="sort-btn" onclick="event.stopPropagation(); sortCustomerNums(${cIdx})">排序</button>
                    </div>
                    <span style="color:var(--m-soft); font-size:11px; flex-shrink:0;" onclick="event.stopPropagation(); deleteCustomer(${cIdx})">删除</span>
                </div>
                <div class="tag-box">${tags || '<small style="color:var(--m-soft)">点击绑定...</small>'}</div>
            `;
            list.appendChild(card);
        });
    }

    function toggleAiPanel() {
        const panel = document.getElementById('aiPanel');
        const show = panel.style.display === 'none';
        panel.style.display = show ? 'block' : 'none';
        if(show) renderAiConfig();
    }

    function toggleApiConfig() {
        document.getElementById('apiConfigPanel').classList.toggle('show');
    }

    function renderPresetSelect() {
        const select = document.getElementById('aiPresetSelect');
        select.innerHTML = '<option value="">— 未选择预设 —</option>' + aiCfg.presets.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
    }

    function renderAiConfig() {
        document.getElementById('aiEndpoint').value = aiCfg.endpoint || '';
        document.getElementById('aiKey').value = aiCfg.key || '';
        document.getElementById('aiModel').value = aiCfg.model || '';
        document.getElementById('aiPrompt').value = aiCfg.prompt || defaultAiPrompt;
        renderPresetSelect();
        renderModelPicker();
        renderAiImages();
        renderAiPreview();
    }

    function saveCurrentPreset() {
        saveAiCfg();
        if(!aiCfg.endpoint) return alert('请先填写接口地址再保存预设。');
        const nameInput = document.getElementById('aiPresetName');
        let name = nameInput.value.trim();
        if(!name) {
            try { name = new URL(aiCfg.endpoint).hostname; } catch(e) { name = `预设${aiCfg.presets.length + 1}`; }
        }
        const existing = aiCfg.presets.findIndex(p => p.name === name);
        const preset = { name, endpoint: aiCfg.endpoint, key: aiCfg.key, model: aiCfg.model };
        if(existing >= 0) {
            if(!confirm(`预设「${name}」已存在，要覆盖它吗？`)) return;
            aiCfg.presets[existing] = preset;
        } else aiCfg.presets.push(preset);
        nameInput.value = '';
        localStorage.setItem('kaki_ai_cfg', JSON.stringify(aiCfg));
        renderPresetSelect();
        document.getElementById('aiPresetSelect').value = String(aiCfg.presets.findIndex(p => p.name === name));
        alert('预设已保存。');
    }

    function applySelectedPreset() {
        const idx = document.getElementById('aiPresetSelect').value;
        if(idx === '') return;
        const preset = aiCfg.presets[Number(idx)];
        if(!preset) return;
        document.getElementById('aiEndpoint').value = preset.endpoint || '';
        document.getElementById('aiKey').value = preset.key || '';
        document.getElementById('aiModel').value = preset.model || '';
        saveAiCfg();
        setAiStatus(`✅ 已应用预设：${preset.name}`);
    }

    function deleteSelectedPreset() {
        const idx = document.getElementById('aiPresetSelect').value;
        if(idx === '') return alert('请先选择一个要删除的预设。');
        const preset = aiCfg.presets[Number(idx)];
        if(!preset || !confirm(`确定删除预设「${preset.name}」吗？`)) return;
        aiCfg.presets.splice(Number(idx), 1);
        localStorage.setItem('kaki_ai_cfg', JSON.stringify(aiCfg));
        renderPresetSelect();
        setAiStatus(`🗑️ 已删除预设：${preset.name}`);
    }

    function setAiStatus(text, show=true) {
        const box = document.getElementById('aiStatus');
        box.innerText = text;
        box.className = 'ai-status' + (show ? ' show' : '');
    }

    function addAiImageFiles(files) {
        const list = Array.from(files || []);
        if(!list.length) return;
        list.forEach(file => {
            if(!file.type.startsWith('image/')) return;
            const id = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
            compressImage(file).then(dataUrl => {
                aiImages.push({ id, name: file.name || '粘贴截图', dataUrl });
                renderAiImages();
            }).catch(() => alert('这张图片读取失败，请重新上传。'));
        });
        document.getElementById('aiImageInput').value = '';
    }

    function removeAiImage(id) {
        aiImages = aiImages.filter(item => item.id !== id);
        renderAiImages();
    }

    function renderAiImages() {
        const box = document.getElementById('aiImageList');
        box.innerHTML = aiImages.map(item => `
            <div class="ai-image-item">
                <img src="${item.dataUrl}" alt="${item.name}">
                <button class="ai-image-remove" onclick="removeAiImage('${item.id}')">✕</button>
            </div>
        `).join('');
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function compressImage(file) {
        const dataUrl = await readFileAsDataURL(file);
        const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = dataUrl;
        });
        const maxSide = 2200;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        if(scale === 1 && file.size < 1800 * 1024) return dataUrl;

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.92);
    }

    function normalizeEndpoint(url) {
        let clean = (url || '').trim().replace(/\/+$/, '');
        if(!clean) throw new Error('请填写接口地址。');
        if(!/\/chat\/completions$/.test(clean)) clean += '/chat/completions';
        return clean;
    }

    function getModelsUrl(url) {
        let clean = (url || '').trim().replace(/\/+$/, '');
        if(!clean) throw new Error('请先填写接口地址。');
        if(clean.endsWith('/chat/completions')) clean = clean.slice(0, -'/chat/completions'.length);
        return clean + '/models';
    }

    

    function buildPrompt() {
        const total = batches[currentIdx].total;
        return (document.getElementById('aiPrompt').value || defaultAiPrompt).replaceAll('{total}', String(total));
    }

    async function fetchAiModels() {
        try {
            saveAiCfg();
            const url = getModelsUrl(document.getElementById('aiEndpoint').value);
            const key = document.getElementById('aiKey').value.trim();
            const headers = {};
            if(key) headers.Authorization = `Bearer ${key}`;
            setAiStatus('正在拉取可用模型...');
            const response = await fetch(url, { headers });
            const text = await response.text();
            if(!response.ok) {
                let msg = text;
                try { msg = JSON.parse(text).error?.message || text; } catch(e) {}
                throw new Error(`接口返回 ${response.status}：${msg}`);
            }
            const json = JSON.parse(text);
            const models = (json.data || []).map(m => m.id).filter(Boolean).sort();
            if(!models.length) throw new Error('接口没有返回可用模型列表。');
            aiModels = models;
            renderModelPicker();
            const currentModel = document.getElementById('aiModel').value.trim();
            if(!models.includes(currentModel)) {
                document.getElementById('aiModel').value = models[0];
                saveAiCfg();
                renderModelPicker();
            }
            setAiStatus(`拉取成功，共 ${models.length} 个模型。请在下方模型列表里点击选择。`);
        } catch(err) {
            setAiStatus(`接口错误：${err.message}`);
        }
    }

    function renderModelPicker() {
        const picker = document.getElementById('aiModelPicker');
        if(!aiModels.length) { picker.classList.remove('show'); return; }
        const currentModel = document.getElementById('aiModel').value.trim();
        picker.innerHTML = aiModels.map(m => `<div class="model-picker-item ${m === currentModel ? 'active' : ''}" onclick="selectAiModel('${m.replace(/'/g, "\\'")}')">${m}</div>`).join('');
        picker.classList.add('show');

        // 点击列表外时自动收起模型选择框
        if(!window.__modelPickerOutsideBound) {
            window.__modelPickerOutsideBound = true;
            document.addEventListener('click', function(event) {
                const picker = document.getElementById('aiModelPicker');
                if(!picker) return;
                if(!picker.contains(event.target) && event.target.id !== 'aiModel') {
                    picker.classList.remove('show');
                }
            });
        }
    }

    function selectAiModel(model) {
        document.getElementById('aiModel').value = model;
        saveAiCfg();
        renderModelPicker();
        document.getElementById('aiModelPicker').classList.remove('show');
    }

    function parseAiJson(raw) {
        let text = (raw || '').trim();
        text = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
        const start = text.indexOf('{');
        const end = text.lastIndexOf('}');
        if(start >= 0 && end > start) text = text.slice(start, end + 1);
        const data = JSON.parse(text);
        if(Array.isArray(data)) return data.filter(Boolean);
        return data.customers || [];
    }

    async function callAiForImage(dataUrl) {
        const endpoint = normalizeEndpoint(document.getElementById('aiEndpoint').value);
        const model = document.getElementById('aiModel').value.trim();
        const key = document.getElementById('aiKey').value.trim();
        if(!model) throw new Error('请填写模型名称。');

        const headers = { 'Content-Type': 'application/json' };
        if(key) headers.Authorization = `Bearer ${key}`;

        const body = {
            model,
            temperature: 0,
            messages: [{
                role: 'user',
                content: [
                    { type: 'text', text: buildPrompt() },
                    { type: 'image_url', image_url: { url: dataUrl } }
                ]
            }]
        };

        const response = await fetch(endpoint, {
            method: 'POST',
            headers,
            body: JSON.stringify(body)
        });

        const text = await response.text();
        if(!response.ok) {
            let msg = text;
            try { msg = JSON.parse(text).error?.message || text; } catch(e) {}
            throw new Error(`接口返回 ${response.status}：${msg}`);
        }
        let json;
        try { json = JSON.parse(text); } catch(e) { throw new Error('接口返回内容不是有效 JSON。'); }
        const content = json?.choices?.[0]?.message?.content;
        if(!content) throw new Error('接口没有返回识图内容。');
        const result = parseAiJson(content);
        if(!Array.isArray(result)) throw new Error('识图结果格式不正确。');
        return result;
    }

    async function runAiImport() {
        try {
            saveAiCfg();
            if(!aiImages.length) throw new Error('请先上传或粘贴聊天记录截图。');
            if(!document.getElementById('aiEndpoint').value.trim()) throw new Error('请先在 API 设置里填写接口地址。');
            if(!document.getElementById('aiModel').value.trim()) throw new Error('请填写或拉取模型名称。');

            aiResults = [];
            renderAiPreview();
            let all = [];
            for(let i = 0; i < aiImages.length; i++) {
                setAiStatus(`🧠 正在识别第 ${i + 1}/${aiImages.length} 张截图...`);
                const customers = await callAiForImage(aiImages[i].dataUrl);
                all = all.concat(customers);
                aiResults = all;
                renderAiPreview();
            }
            setAiStatus(`✅ 识别完成，共 ${all.length} 条用户记录。请检查预览后点击导入。`);
        } catch(err) {
            setAiStatus(`❌ ${err.message}`);
        }
    }

    function renderAiPreview() {
        const box = document.getElementById('aiPreview');
        if(!aiResults.length) { box.innerHTML = ''; return; }
        const current = batches[currentIdx];
        const sold = current.customers.flatMap(c => c.nums.flat());

        box.innerHTML = aiResults.map((item, idx) => {
            const name = item.name || `未识别用户${idx + 1}`;
            const nums = (item.numbers || []).filter(n => Number.isFinite(Number(n))).map(Number);
            const exists = current.customers.some(c => c.name === name);
            const chips = nums.map(n => {
                const invalid = n < 1 || n > current.total;
                const taken = sold.includes(n);
                const warn = invalid || taken;
                return `<span class="ai-num ${warn ? 'warn' : ''}">${n}${invalid ? ' 超范围' : ''}${taken ? ' 已占用' : ''}</span>`;
            }).join('') || '<span class="ai-note">未识别到有效编号</span>';
            return `
                <div class="ai-preview-card">
                    <div class="ai-preview-head"><span>👤 ${name}</span><span class="ai-badge ${exists ? 'exists' : ''}">${exists ? '已有用户' : '新用户'}</span></div>
                    <div class="ai-num-list">${chips}</div>
                </div>
            `;
        }).join('') + `
            <div class="ai-actions">
                <button class="btn-action" onclick="confirmImportAiResults()">✅ 确认导入</button>
                <button class="btn-clear" onclick="clearAiPreview()">取消</button>
            </div>
        `;
    }

    function confirmImportAiResults() {
        if(!aiResults.length) return;
        let imported = 0, skipped = 0;
        const total = batches[currentIdx].total;

        aiResults.forEach(item => {
            const name = (item.name || '').trim();
            if(!name) { skipped++; return; }
            let nums = [...new Set((item.numbers || []).map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= total))];

            const existing = batches[currentIdx].customers.find(c => c.name === name);
            if(existing) {
                const owned = existing.nums.flat();
                const fresh = nums.filter(n => !owned.includes(n));
                if(fresh.length) {
                    existing.nums.push(fresh.sort((a, b) => a - b));
                    imported += fresh.length;
                } else skipped++;
            } else {
                if(nums.length) {
                    batches[currentIdx].customers.unshift({ name, nums: [nums.sort((a, b) => a - b)] });
                    imported += nums.length;
                } else skipped++;
            }
        });

        aiResults = [];
        renderAiImages();
        renderAll();
        save();
        setAiStatus(`✅ 导入完成：新增绑定 ${imported} 个编号；跳过/重复 ${skipped} 条。`);
    }

    function clearAiPreview() {
        aiResults = [];
        renderAiPreview();
        setAiStatus('', false);
    }

    document.addEventListener('paste', function(event) {
        const panel = document.getElementById('aiPanel');
        if(panel.style.display === 'none' || !event.clipboardData?.files?.length) return;
        const hasImage = Array.from(event.clipboardData.files).some(file => file.type.startsWith('image/'));
        if(hasImage) {
            event.preventDefault();
            addAiImageFiles(event.clipboardData.files);
        }
    });

    document.addEventListener('dragover', function(event) {
        const upload = event.target.closest('.ai-upload');
        if(upload) event.preventDefault();
    });
    document.addEventListener('drop', function(event) {
        const upload = event.target.closest('.ai-upload');
        if(!upload || !event.dataTransfer?.files?.length) return;
        event.preventDefault();
        addAiImageFiles(event.dataTransfer.files);
    });

    renderAll();
</script>
</body>
</html>
